name: Deploy to ECS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: 767691736567.dkr.ecr.eu-north-1.amazonaws.com
          ECR_REPOSITORY: simple_api
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Register New ECS Task Definition
        env:
          ECR_IMAGE: 767691736567.dkr.ecr.eu-north-1.amazonaws.com/simple_api:latest
        run: |
          sed -i "s|YOUR_ECR_IMAGE_URI|$ECR_IMAGE|g" ecs-task.json
          aws ecs register-task-definition \
            --cli-input-json file://ecs-task.json

      - name: Deploy to ECS Service
        run: |
          aws ecs update-service \
            --cluster simple-api-cluster \
            --service simple-api-service \
            --force-new-deployment
